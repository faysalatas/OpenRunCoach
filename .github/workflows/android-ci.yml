name: Android CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android unit tests and debug build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate wrapper and configure Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
        with:
          cache-disabled: true

      - name: Provision Samsung SDK
        id: sdk
        env:
          SAMSUNG_HEALTH_SDK_URL: ${{ secrets.SAMSUNG_HEALTH_SDK_URL }}
          SAMSUNG_HEALTH_SDK_SHA256: ${{ vars.SAMSUNG_HEALTH_SDK_SHA256 }}
        run: python3 .github/scripts/provision_samsung_sdk.py

      - name: Install Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'

      - name: Run JVM unit tests
        id: tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Assemble debug app
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload unit-test reports only
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: warn
          retention-days: 7

      - name: Remove provisioned SDK
        if: always()
        run: rm -f app/libs/samsung-health-data-api.aar
